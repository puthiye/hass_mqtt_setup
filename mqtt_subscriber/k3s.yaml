apiVersion: v1
kind: Pod
metadata:
  name: mqtt-subscriber
  namespace: apps
spec:
  containers:
    - name: subscriber
      image: eclipse-mosquitto:2
      command: ["mosquitto_sub"]
      args:
        - -h
        - mosquitto-mqtt-broker.apps.svc.cluster.local
        - -t
        - home/switch/status
        - -v
